# hyprlock.conf — Tokyo Night lock screen

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
}

# Background: blurred wallpaper + vibrancy boost; solid fallback
background {
    monitor     =
    blur_passes = 3
    blur_size   = 8
    vibrancy    = 0.15
    color       = rgba(1e1e2eff)
}

# Clock — large, centered high
label {
    monitor     =
    text        = cmd[update:1000] echo "<b>$(date '+%H:%M')</b>"
    color       = rgba(cdd6f4ff)
    font_size   = 80
    font_family = JetBrainsMono Nerd Font
    position    = 0, 230
    halign      = center
    valign      = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color       = rgba(6c7086ff)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 158
    halign      = center
    valign      = center
}

# Fortune quote — random short quote at lock time
label {
    monitor     =
    text        = cmd[update:0] fortune -s 2>/dev/null | tr -d '\t' | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//'
    color       = rgba(6c7086ff)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, 45
    halign      = center
    valign      = center
}

# Password input field
input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 2
    rounding          = 12
    dots_size         = 0.25
    dots_spacing      = 0.3
    dots_center       = true
    dots_rounding     = -1
    outer_color       = rgba(89b4faff)
    inner_color       = rgba(313244ff)
    font_color        = rgba(cdd6f4ff)
    check_color       = rgba(a6e3a1ff)
    fail_color        = rgba(f38ba8ff)
    capslock_color    = rgba(f9e2afff)
    fade_on_empty     = true
    placeholder_text  = <span foreground="##6c7086">password...</span>
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position          = 0, -70
    halign            = center
    valign            = center
}
