# hypridle.conf — Idle daemon: dims screen → locks session → display off → suspends.

general {
    lock_cmd         = pidof quickshell || env QS_THEME=pixel-sakura qylock-lock  # bare `clockwork` has no Main.qml (only sub-themes) → black surface
    before_sleep_cmd = loginctl lock-session
    # Wait for Hyprland socket to be ready after NVIDIA GPU state restore,
    # then force a DPMS cycle to kick the compositor out of the blank state.
    after_sleep_cmd  = bash -c 'until hyprctl monitors &>/dev/null; do sleep 0.5; done; hyprctl dispatch dpms off && sleep 1 && hyprctl dispatch dpms on'
}

# 3 min: dim to 20% to signal inactivity (restores on resume)
listener {
    timeout    = 180
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

# 5 min: lock the session
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 6 min: turn off display (1 min after lock so screen is already locked)
listener {
    timeout    = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 7 min: suspend — after_sleep_cmd above handles resume recovery
listener {
    timeout    = 420
    on-timeout = systemctl suspend
}
