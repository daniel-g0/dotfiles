# hypridle.conf — Idle daemon: dims screen → locks session → display off → suspends.

general {
    lock_cmd         = pidof hyprlock || hyprlock  # avoid spawning a second instance
    before_sleep_cmd = pidof hyprlock || hyprlock   # always lock before suspend
    after_sleep_cmd  = sleep 1 && hyprctl dispatch dpms on     # wait for Hyprland socket on wake
}

# 3 min: dim to 20% to signal inactivity (restores on resume)
listener {
    timeout    = 180
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

# 5 min: lock the session
listener {
    timeout    = 300
    on-timeout = pidof hyprlock || hyprlock
}

# 6 min: turn off display (1 min after lock so screen is already locked)
listener {
    timeout    = 360
    on-timeout = hyprctl dispatch dpms off
}

# 7 min: suspend the system
listener {
    timeout    = 420
    on-timeout = systemctl suspend
}
