# Dynamic theme — generated by apply-theme. Do not edit.

[mgr]
cwd = { fg = "#c4303f" }

hovered         = { fg = "#0a0a0b", bg = "#c4303f" }
preview_hovered = { bg = "#0a0a0b", underline = true }

find_keyword  = { fg = "#e8a04c", bg = "#0a0a0b", bold = true, italic = true, underline = true }
find_position = { fg = "#e8a04c", bg = "#0a0a0b", bold = true, italic = true }

symlink_target = { fg = "#ff7a7a", bg = "#0a0a0b" }

marker_copied   = { fg = "#8aa37b", bg = "#8aa37b" }
marker_cut      = { fg = "#ff5566", bg = "#ff5566" }
marker_marked   = { fg = "#e8a04c", bg = "#e8a04c" }
marker_selected = { fg = "#c4303f", bg = "#c4303f" }

count_copied   = { fg = "#0a0a0b", bg = "#8aa37b" }
count_cut      = { fg = "#0a0a0b", bg = "#ff5566" }
count_selected = { fg = "#0a0a0b", bg = "#c4303f" }

border_symbol = "│"
border_style  = { fg = "#261c1d" }

syntect_theme = "base16-ocean.dark"

[indicator]
parent  = { fg = "#7a5256", bg = "#0a0a0b" }
current = { fg = "#e6dcdc", bg = "#0a0a0b" }
preview = { fg = "#7a5256", bg = "#0a0a0b" }

[tabs]
active   = { fg = "#0a0a0b", bg = "#c4303f" }
inactive = { fg = "#b49292", bg = "#1a1011" }

[mode]
normal_main = { fg = "#0a0a0b", bg = "#c4303f", bold = true }
normal_alt  = { fg = "#c4303f", bg = "#1a1011", bold = true }
select_main = { fg = "#0a0a0b", bg = "#8aa37b", bold = true }
select_alt  = { fg = "#8aa37b", bg = "#1a1011", bold = true }
unset_main  = { fg = "#0a0a0b", bg = "#ff2a3d", bold = true }
unset_alt   = { fg = "#ff2a3d", bg = "#1a1011", bold = true }

[status]
overall   = { fg = "#e6dcdc", bg = "#0a0a0b" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#e6dcdc", bg = "#0a0a0b", bold = true }
progress_normal = { fg = "#c4303f", bg = "#1a1011" }
progress_error  = { fg = "#ff5566", bg = "#1a1011" }

perm_type  = { fg = "#c4303f", bg = "#0a0a0b" }
perm_read  = { fg = "#e8a04c", bg = "#0a0a0b" }
perm_write = { fg = "#ff5566", bg = "#0a0a0b" }
perm_exec  = { fg = "#8aa37b", bg = "#0a0a0b" }
perm_sep   = { fg = "#261c1d", bg = "#0a0a0b" }

[input]
border   = { fg = "#c4303f", bg = "#0a0a0b" }
title    = { fg = "#c4303f", bg = "#0a0a0b" }
value    = { fg = "#e6dcdc", bg = "#0a0a0b" }
selected = { fg = "#0a0a0b", bg = "#c4303f" }

[cmp]
border   = { fg = "#c4303f", bg = "#0a0a0b" }
active   = { fg = "#0a0a0b", bg = "#c4303f" }
inactive = { fg = "#b49292", bg = "#0a0a0b" }

[tasks]
border  = { fg = "#c4303f", bg = "#0a0a0b" }
title   = { fg = "#c4303f", bg = "#0a0a0b" }
hovered = { bg = "#1a1011", underline = true }

[which]
mask            = { bg = "#0a0a0b" }
cand            = { fg = "#ff7a7a", bg = "#0a0a0b" }
rest            = { fg = "#7a5256", bg = "#0a0a0b" }
desc            = { fg = "#ff2a3d", bg = "#0a0a0b" }
separator       = "  "
separator_style = { fg = "#261c1d", bg = "#0a0a0b" }

[help]
on      = { fg = "#ff7a7a", bg = "#0a0a0b" }
run     = { fg = "#ff2a3d", bg = "#0a0a0b" }
desc    = { fg = "#b49292", bg = "#0a0a0b" }
hovered = { bg = "#1a1011", bold = true }
footer  = { fg = "#0a0a0b", bg = "#c4303f" }

[spot]
border = { fg = "#c4303f", bg = "#0a0a0b" }
title  = { fg = "#c4303f", bg = "#0a0a0b" }

[notify]
title_info  = { fg = "#8aa37b", bg = "#0a0a0b" }
title_warn  = { fg = "#e8a04c", bg = "#0a0a0b" }
title_error = { fg = "#ff5566", bg = "#0a0a0b" }

[pick]
border   = { fg = "#c4303f", bg = "#0a0a0b" }
active   = { fg = "#0a0a0b", bg = "#c4303f" }
inactive = { fg = "#b49292", bg = "#0a0a0b" }

[confirm]
border  = { fg = "#c4303f", bg = "#0a0a0b" }
title   = { fg = "#c4303f", bg = "#0a0a0b" }
body    = { fg = "#e6dcdc", bg = "#0a0a0b" }
list    = { fg = "#b49292", bg = "#0a0a0b" }
btn_yes = { fg = "#0a0a0b", bg = "#c4303f", bold = true }
btn_no  = { fg = "#e6dcdc", bg = "#1a1011" }

[filetype]
rules = [
  { mime = "image/*",                     fg = "#ff7a7a" },
  { mime = "video/*",                     fg = "#ff2a3d" },
  { mime = "audio/*",                     fg = "#ff2a3d" },
  { mime = "application/zip",             fg = "#e8a04c" },
  { mime = "application/gzip",            fg = "#e8a04c" },
  { mime = "application/x-tar",           fg = "#e8a04c" },
  { mime = "application/x-bzip*",         fg = "#e8a04c" },
  { mime = "application/x-7z-compressed", fg = "#e8a04c" },
  { mime = "application/x-rar",           fg = "#e8a04c" },
  { mime = "application/xz",              fg = "#e8a04c" },
  { mime = "application/pdf",             fg = "#ff5566" },
  { mime = "application/doc",             fg = "#c4303f" },
  { mime = "application/docx",            fg = "#c4303f" },
  { mime = "text/*",                      fg = "#8aa37b" },
  { url = "*/",   fg = "#c4303f" },
  { url = "*", is = "exec", fg = "#8aa37b" },
  { url = "*",    fg = "#e6dcdc" },
]
