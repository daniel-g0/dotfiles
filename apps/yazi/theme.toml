find_keyword  = { fg = "#e0af68", bg = "#1b1817", bold = true, italic = true, underline = true }
find_position = { fg = "#e0af68", bg = "#1b1817", bold = true, italic = true }

symlink_target = { fg = "#2ac3de", bg = "#1b1817" }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#e0af68", bg = "#e0af68" }
marker_selected = { fg = "#e3a258", bg = "#e3a258" }

count_copied   = { fg = "#1b1817", bg = "#9ece6a" }
