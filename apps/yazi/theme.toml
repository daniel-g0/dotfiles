# Dynamic theme — generated by apply-theme. Do not edit.

[mgr]
cwd = { fg = "#5e81ac" }

hovered         = { fg = "#2e3440", bg = "#5e81ac" }
preview_hovered = { bg = "#2e3440", underline = true }

find_keyword  = { fg = "#ebcb8b", bg = "#2e3440", bold = true, italic = true, underline = true }
find_position = { fg = "#ebcb8b", bg = "#2e3440", bold = true, italic = true }

symlink_target = { fg = "#88c0d0", bg = "#2e3440" }

marker_copied   = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut      = { fg = "#bf616a", bg = "#bf616a" }
marker_marked   = { fg = "#ebcb8b", bg = "#ebcb8b" }
marker_selected = { fg = "#5e81ac", bg = "#5e81ac" }

count_copied   = { fg = "#2e3440", bg = "#a3be8c" }
count_cut      = { fg = "#2e3440", bg = "#bf616a" }
count_selected = { fg = "#2e3440", bg = "#5e81ac" }

border_symbol = "│"
border_style  = { fg = "#454953" }

syntect_theme = "base16-ocean.dark"

[indicator]
parent  = { fg = "#4c566a", bg = "#2e3440" }
current = { fg = "#eceff4", bg = "#2e3440" }
preview = { fg = "#4c566a", bg = "#2e3440" }

[tabs]
active   = { fg = "#2e3440", bg = "#5e81ac" }
inactive = { fg = "#92a0b8", bg = "#3b4252" }

[mode]
normal_main = { fg = "#2e3440", bg = "#5e81ac", bold = true }
normal_alt  = { fg = "#5e81ac", bg = "#3b4252", bold = true }
select_main = { fg = "#2e3440", bg = "#a3be8c", bold = true }
select_alt  = { fg = "#a3be8c", bg = "#3b4252", bold = true }
unset_main  = { fg = "#2e3440", bg = "#b48ead", bold = true }
unset_alt   = { fg = "#b48ead", bg = "#3b4252", bold = true }

[status]
overall   = { fg = "#eceff4", bg = "#2e3440" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#eceff4", bg = "#2e3440", bold = true }
progress_normal = { fg = "#5e81ac", bg = "#3b4252" }
progress_error  = { fg = "#bf616a", bg = "#3b4252" }

perm_type  = { fg = "#5e81ac", bg = "#2e3440" }
perm_read  = { fg = "#ebcb8b", bg = "#2e3440" }
perm_write = { fg = "#bf616a", bg = "#2e3440" }
perm_exec  = { fg = "#a3be8c", bg = "#2e3440" }
perm_sep   = { fg = "#454953", bg = "#2e3440" }

[input]
border   = { fg = "#5e81ac", bg = "#2e3440" }
title    = { fg = "#5e81ac", bg = "#2e3440" }
value    = { fg = "#eceff4", bg = "#2e3440" }
selected = { fg = "#2e3440", bg = "#5e81ac" }

[cmp]
border   = { fg = "#5e81ac", bg = "#2e3440" }
active   = { fg = "#2e3440", bg = "#5e81ac" }
inactive = { fg = "#92a0b8", bg = "#2e3440" }

[tasks]
border  = { fg = "#5e81ac", bg = "#2e3440" }
title   = { fg = "#5e81ac", bg = "#2e3440" }
hovered = { bg = "#3b4252", underline = true }

[which]
mask            = { bg = "#2e3440" }
cand            = { fg = "#88c0d0", bg = "#2e3440" }
rest            = { fg = "#4c566a", bg = "#2e3440" }
desc            = { fg = "#b48ead", bg = "#2e3440" }
separator       = "  "
separator_style = { fg = "#454953", bg = "#2e3440" }

[help]
on      = { fg = "#88c0d0", bg = "#2e3440" }
run     = { fg = "#b48ead", bg = "#2e3440" }
desc    = { fg = "#92a0b8", bg = "#2e3440" }
hovered = { bg = "#3b4252", bold = true }
footer  = { fg = "#2e3440", bg = "#5e81ac" }

[spot]
border = { fg = "#5e81ac", bg = "#2e3440" }
title  = { fg = "#5e81ac", bg = "#2e3440" }

[notify]
title_info  = { fg = "#a3be8c", bg = "#2e3440" }
title_warn  = { fg = "#ebcb8b", bg = "#2e3440" }
title_error = { fg = "#bf616a", bg = "#2e3440" }

[pick]
border   = { fg = "#5e81ac", bg = "#2e3440" }
active   = { fg = "#2e3440", bg = "#5e81ac" }
inactive = { fg = "#92a0b8", bg = "#2e3440" }

[confirm]
border  = { fg = "#5e81ac", bg = "#2e3440" }
title   = { fg = "#5e81ac", bg = "#2e3440" }
body    = { fg = "#eceff4", bg = "#2e3440" }
list    = { fg = "#92a0b8", bg = "#2e3440" }
btn_yes = { fg = "#2e3440", bg = "#5e81ac", bold = true }
btn_no  = { fg = "#eceff4", bg = "#3b4252" }

[filetype]
rules = [
  { mime = "image/*",                     fg = "#88c0d0" },
  { mime = "video/*",                     fg = "#b48ead" },
  { mime = "audio/*",                     fg = "#b48ead" },
  { mime = "application/zip",             fg = "#ebcb8b" },
  { mime = "application/gzip",            fg = "#ebcb8b" },
  { mime = "application/x-tar",           fg = "#ebcb8b" },
  { mime = "application/x-bzip*",         fg = "#ebcb8b" },
  { mime = "application/x-7z-compressed", fg = "#ebcb8b" },
  { mime = "application/x-rar",           fg = "#ebcb8b" },
  { mime = "application/xz",              fg = "#ebcb8b" },
  { mime = "application/pdf",             fg = "#bf616a" },
  { mime = "application/doc",             fg = "#5e81ac" },
  { mime = "application/docx",            fg = "#5e81ac" },
  { mime = "text/*",                      fg = "#a3be8c" },
  { url = "*/",   fg = "#5e81ac" },
  { url = "*", is = "exec", fg = "#a3be8c" },
  { url = "*",    fg = "#eceff4" },
]
