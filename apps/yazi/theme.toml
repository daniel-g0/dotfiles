inactive = { fg = "#8e9ccb", bg = "#313244" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
normal_alt  = { fg = "#89b4fa", bg = "#313244", bold = true }
select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt  = { fg = "#a6e3a1", bg = "#313244", bold = true }
unset_main  = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
unset_alt   = { fg = "#cba6f7", bg = "#313244", bold = true }

[status]
