# Dynamic theme — generated by apply-theme. Do not edit.

[mgr]
cwd = { fg = "#c4885f" }

hovered         = { fg = "#1a1510", bg = "#c4885f" }
preview_hovered = { bg = "#1a1510", underline = true }

find_keyword  = { fg = "#d4a843", bg = "#1a1510", bold = true, italic = true, underline = true }
find_position = { fg = "#d4a843", bg = "#1a1510", bold = true, italic = true }

symlink_target = { fg = "#8faa90", bg = "#1a1510" }

marker_copied   = { fg = "#8fa876", bg = "#8fa876" }
marker_cut      = { fg = "#c44b4b", bg = "#c44b4b" }
marker_marked   = { fg = "#d4a843", bg = "#d4a843" }
marker_selected = { fg = "#c4885f", bg = "#c4885f" }

count_copied   = { fg = "#1a1510", bg = "#8fa876" }
count_cut      = { fg = "#1a1510", bg = "#c44b4b" }
count_selected = { fg = "#1a1510", bg = "#c4885f" }

border_symbol = "│"
border_style  = { fg = "#363129" }

syntect_theme = "base16-ocean.dark"

[indicator]
parent  = { fg = "#7a6e5e", bg = "#1a1510" }
current = { fg = "#e8dcc8", bg = "#1a1510" }
preview = { fg = "#7a6e5e", bg = "#1a1510" }

[tabs]
active   = { fg = "#1a1510", bg = "#c4885f" }
inactive = { fg = "#bba888", bg = "#252017" }

[mode]
normal_main = { fg = "#1a1510", bg = "#c4885f", bold = true }
normal_alt  = { fg = "#c4885f", bg = "#252017", bold = true }
select_main = { fg = "#1a1510", bg = "#8fa876", bold = true }
select_alt  = { fg = "#8fa876", bg = "#252017", bold = true }
unset_main  = { fg = "#1a1510", bg = "#d97757", bold = true }
unset_alt   = { fg = "#d97757", bg = "#252017", bold = true }

[status]
overall   = { fg = "#e8dcc8", bg = "#1a1510" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#e8dcc8", bg = "#1a1510", bold = true }
progress_normal = { fg = "#c4885f", bg = "#252017" }
progress_error  = { fg = "#c44b4b", bg = "#252017" }

perm_type  = { fg = "#c4885f", bg = "#1a1510" }
perm_read  = { fg = "#d4a843", bg = "#1a1510" }
perm_write = { fg = "#c44b4b", bg = "#1a1510" }
perm_exec  = { fg = "#8fa876", bg = "#1a1510" }
perm_sep   = { fg = "#363129", bg = "#1a1510" }

[input]
border   = { fg = "#c4885f", bg = "#1a1510" }
title    = { fg = "#c4885f", bg = "#1a1510" }
value    = { fg = "#e8dcc8", bg = "#1a1510" }
selected = { fg = "#1a1510", bg = "#c4885f" }

[cmp]
border   = { fg = "#c4885f", bg = "#1a1510" }
active   = { fg = "#1a1510", bg = "#c4885f" }
inactive = { fg = "#bba888", bg = "#1a1510" }

[tasks]
border  = { fg = "#c4885f", bg = "#1a1510" }
title   = { fg = "#c4885f", bg = "#1a1510" }
hovered = { bg = "#252017", underline = true }

[which]
mask            = { bg = "#1a1510" }
cand            = { fg = "#8faa90", bg = "#1a1510" }
rest            = { fg = "#7a6e5e", bg = "#1a1510" }
desc            = { fg = "#d97757", bg = "#1a1510" }
separator       = "  "
separator_style = { fg = "#363129", bg = "#1a1510" }

[help]
on      = { fg = "#8faa90", bg = "#1a1510" }
run     = { fg = "#d97757", bg = "#1a1510" }
desc    = { fg = "#bba888", bg = "#1a1510" }
hovered = { bg = "#252017", bold = true }
footer  = { fg = "#1a1510", bg = "#c4885f" }

[spot]
border = { fg = "#c4885f", bg = "#1a1510" }
title  = { fg = "#c4885f", bg = "#1a1510" }

[notify]
title_info  = { fg = "#8fa876", bg = "#1a1510" }
title_warn  = { fg = "#d4a843", bg = "#1a1510" }
title_error = { fg = "#c44b4b", bg = "#1a1510" }

[pick]
border   = { fg = "#c4885f", bg = "#1a1510" }
active   = { fg = "#1a1510", bg = "#c4885f" }
inactive = { fg = "#bba888", bg = "#1a1510" }

[confirm]
border  = { fg = "#c4885f", bg = "#1a1510" }
title   = { fg = "#c4885f", bg = "#1a1510" }
body    = { fg = "#e8dcc8", bg = "#1a1510" }
list    = { fg = "#bba888", bg = "#1a1510" }
btn_yes = { fg = "#1a1510", bg = "#c4885f", bold = true }
btn_no  = { fg = "#e8dcc8", bg = "#252017" }

[filetype]
rules = [
  { mime = "image/*",                     fg = "#8faa90" },
  { mime = "video/*",                     fg = "#d97757" },
  { mime = "audio/*",                     fg = "#d97757" },
  { mime = "application/zip",             fg = "#d4a843" },
  { mime = "application/gzip",            fg = "#d4a843" },
  { mime = "application/x-tar",           fg = "#d4a843" },
  { mime = "application/x-bzip*",         fg = "#d4a843" },
  { mime = "application/x-7z-compressed", fg = "#d4a843" },
  { mime = "application/x-rar",           fg = "#d4a843" },
  { mime = "application/xz",              fg = "#d4a843" },
  { mime = "application/pdf",             fg = "#c44b4b" },
  { mime = "application/doc",             fg = "#c4885f" },
  { mime = "application/docx",            fg = "#c4885f" },
  { mime = "text/*",                      fg = "#8fa876" },
  { url = "*/",   fg = "#c4885f" },
  { url = "*", is = "exec", fg = "#8fa876" },
  { url = "*",    fg = "#e8dcc8" },
]
