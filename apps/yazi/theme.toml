run     = { fg = "#cba6f7", bg = "#1e1e2e" }
desc    = { fg = "#8e9ccb", bg = "#1e1e2e" }
hovered = { bg = "#313244", bold = true }
footer  = { fg = "#1e1e2e", bg = "#89b4fa" }

[spot]
border = { fg = "#89b4fa", bg = "#1e1e2e" }
