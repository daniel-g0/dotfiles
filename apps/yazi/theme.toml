# Dynamic theme — generated by apply-theme. Do not edit.

[mgr]
cwd = { fg = "#3d9bd9" }

hovered         = { fg = "#08141f", bg = "#3d9bd9" }
preview_hovered = { bg = "#08141f", underline = true }

find_keyword  = { fg = "#f2c76e", bg = "#08141f", bold = true, italic = true, underline = true }
find_position = { fg = "#f2c76e", bg = "#08141f", bold = true, italic = true }

symlink_target = { fg = "#4fd6e0", bg = "#08141f" }

marker_copied   = { fg = "#58d6a0", bg = "#58d6a0" }
marker_cut      = { fg = "#f0647a", bg = "#f0647a" }
marker_marked   = { fg = "#f2c76e", bg = "#f2c76e" }
marker_selected = { fg = "#3d9bd9", bg = "#3d9bd9" }

count_copied   = { fg = "#08141f", bg = "#58d6a0" }
count_cut      = { fg = "#08141f", bg = "#f0647a" }
count_selected = { fg = "#08141f", bg = "#3d9bd9" }

border_symbol = "│"
border_style  = { fg = "#233546" }

syntect_theme = "base16-ocean.dark"

[indicator]
parent  = { fg = "#4f7088", bg = "#08141f" }
current = { fg = "#d3e6f2", bg = "#08141f" }
preview = { fg = "#4f7088", bg = "#08141f" }

[tabs]
active   = { fg = "#08141f", bg = "#3d9bd9" }
inactive = { fg = "#83afca", bg = "#0f2233" }

[mode]
normal_main = { fg = "#08141f", bg = "#3d9bd9", bold = true }
normal_alt  = { fg = "#3d9bd9", bg = "#0f2233", bold = true }
select_main = { fg = "#08141f", bg = "#58d6a0", bold = true }
select_alt  = { fg = "#58d6a0", bg = "#0f2233", bold = true }
unset_main  = { fg = "#08141f", bg = "#7aa5ff", bold = true }
unset_alt   = { fg = "#7aa5ff", bg = "#0f2233", bold = true }

[status]
overall   = { fg = "#d3e6f2", bg = "#08141f" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#d3e6f2", bg = "#08141f", bold = true }
progress_normal = { fg = "#3d9bd9", bg = "#0f2233" }
progress_error  = { fg = "#f0647a", bg = "#0f2233" }

perm_type  = { fg = "#3d9bd9", bg = "#08141f" }
perm_read  = { fg = "#f2c76e", bg = "#08141f" }
perm_write = { fg = "#f0647a", bg = "#08141f" }
perm_exec  = { fg = "#58d6a0", bg = "#08141f" }
perm_sep   = { fg = "#233546", bg = "#08141f" }

[input]
border   = { fg = "#3d9bd9", bg = "#08141f" }
title    = { fg = "#3d9bd9", bg = "#08141f" }
value    = { fg = "#d3e6f2", bg = "#08141f" }
selected = { fg = "#08141f", bg = "#3d9bd9" }

[cmp]
border   = { fg = "#3d9bd9", bg = "#08141f" }
active   = { fg = "#08141f", bg = "#3d9bd9" }
inactive = { fg = "#83afca", bg = "#08141f" }

[tasks]
border  = { fg = "#3d9bd9", bg = "#08141f" }
title   = { fg = "#3d9bd9", bg = "#08141f" }
hovered = { bg = "#0f2233", underline = true }

[which]
mask            = { bg = "#08141f" }
cand            = { fg = "#4fd6e0", bg = "#08141f" }
rest            = { fg = "#4f7088", bg = "#08141f" }
desc            = { fg = "#7aa5ff", bg = "#08141f" }
separator       = "  "
separator_style = { fg = "#233546", bg = "#08141f" }

[help]
on      = { fg = "#4fd6e0", bg = "#08141f" }
run     = { fg = "#7aa5ff", bg = "#08141f" }
desc    = { fg = "#83afca", bg = "#08141f" }
hovered = { bg = "#0f2233", bold = true }
footer  = { fg = "#08141f", bg = "#3d9bd9" }

[spot]
border = { fg = "#3d9bd9", bg = "#08141f" }
title  = { fg = "#3d9bd9", bg = "#08141f" }

[notify]
title_info  = { fg = "#58d6a0", bg = "#08141f" }
title_warn  = { fg = "#f2c76e", bg = "#08141f" }
title_error = { fg = "#f0647a", bg = "#08141f" }

[pick]
border   = { fg = "#3d9bd9", bg = "#08141f" }
active   = { fg = "#08141f", bg = "#3d9bd9" }
inactive = { fg = "#83afca", bg = "#08141f" }

[confirm]
border  = { fg = "#3d9bd9", bg = "#08141f" }
title   = { fg = "#3d9bd9", bg = "#08141f" }
body    = { fg = "#d3e6f2", bg = "#08141f" }
list    = { fg = "#83afca", bg = "#08141f" }
btn_yes = { fg = "#08141f", bg = "#3d9bd9", bold = true }
btn_no  = { fg = "#d3e6f2", bg = "#0f2233" }

[filetype]
rules = [
  { mime = "image/*",                     fg = "#4fd6e0" },
  { mime = "video/*",                     fg = "#7aa5ff" },
  { mime = "audio/*",                     fg = "#7aa5ff" },
  { mime = "application/zip",             fg = "#f2c76e" },
  { mime = "application/gzip",            fg = "#f2c76e" },
  { mime = "application/x-tar",           fg = "#f2c76e" },
  { mime = "application/x-bzip*",         fg = "#f2c76e" },
  { mime = "application/x-7z-compressed", fg = "#f2c76e" },
  { mime = "application/x-rar",           fg = "#f2c76e" },
  { mime = "application/xz",              fg = "#f2c76e" },
  { mime = "application/pdf",             fg = "#f0647a" },
  { mime = "application/doc",             fg = "#3d9bd9" },
  { mime = "application/docx",            fg = "#3d9bd9" },
  { mime = "text/*",                      fg = "#58d6a0" },
  { url = "*/",   fg = "#3d9bd9" },
  { url = "*", is = "exec", fg = "#58d6a0" },
  { url = "*",    fg = "#d3e6f2" },
]
