# Dynamic theme — generated by apply-theme. Do not edit.

[mgr]
cwd = { fg = "#89b4fa" }

hovered         = { fg = "#1e1e2e", bg = "#89b4fa" }
preview_hovered = { bg = "#1e1e2e", underline = true }

find_keyword  = { fg = "#f9e2af", bg = "#1e1e2e", bold = true, italic = true, underline = true }
find_position = { fg = "#f9e2af", bg = "#1e1e2e", bold = true, italic = true }

symlink_target = { fg = "#89dceb", bg = "#1e1e2e" }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#f9e2af", bg = "#f9e2af" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#89b4fa" }

border_symbol = "│"
border_style  = { fg = "#454553" }

syntect_theme = "base16-ocean.dark"

[indicator]
